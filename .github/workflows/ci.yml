name: CI

on:
  push:
    branches:
      - iceraven

permissions:
  contents: write

jobs:
  release-automation:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Inspect memory
        run: free -h

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD)" >> $GITHUB_ENV

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Relpace strings
        run: |
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build forkRelease variant of app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          /usr/bin/time -v ./gradlew app:assembleForkRelease -PversionName=${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: Debug
        run: |
          /usr/bin/ls -alh gradle/build/app/outputs/apk/forkRelease/

      - name: Create signed APKs
        uses: akliuxingyuan/sign-android-release@v2.0.1
        with:
          releaseDir: gradle/build/app/outputs/apk/forkRelease/
          signingKey: ${{ secrets.DEBUG_SIGNING_KEY }}
          keyAlias: ${{ secrets.DEBUG_ALIAS }}
          keyStorePassword: ${{ secrets.DEBUG_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Debug
        run: |
          /usr/bin/ls -alh gradle/build/app/outputs/apk/forkRelease/

      - name: Upload arm64 apk
        uses: actions/upload-artifact@v7
        with:
          path: gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease.apk
          name: ${{ env.VERSION_NAME }}-arm64-v8a.apk

      - name: Upload armeabi apk
        uses: actions/upload-artifact@v7
        with:
          path: gradle/build/app/outputs/apk/forkRelease/app-armeabi-v7a-forkRelease.apk
          name: ${{ env.VERSION_NAME }}-armeabi-v7a.apk

      - name: Upload x86_64 apk
        uses: actions/upload-artifact@v7
        with:
          path: gradle/build/app/outputs/apk/forkRelease/app-x86_64-forkRelease.apk
          name: ${{ env.VERSION_NAME }}-x86_64.apk

      - name: Publish GitHub Release
        if: startsWith(github.event.head_commit.message, '[release] ')
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_LINE="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)"
          RELEASE_TAG="${RELEASE_LINE#\[release\] }"
          RELEASE_DIR="gradle/build/app/outputs/apk/forkRelease"
          cp "$RELEASE_DIR/app-arm64-v8a-forkRelease.apk" "${RELEASE_TAG}-arm64-v8a.apk"
          cp "$RELEASE_DIR/app-armeabi-v7a-forkRelease.apk" "${RELEASE_TAG}-armeabi-v7a.apk"
          cp "$RELEASE_DIR/app-x86_64-forkRelease.apk" "${RELEASE_TAG}-x86_64.apk"
          sha256sum "${RELEASE_TAG}-arm64-v8a.apk" "${RELEASE_TAG}-armeabi-v7a.apk" "${RELEASE_TAG}-x86_64.apk" > SHA256SUMS

          TITLE="Iceraven ${RELEASE_TAG#iceraven-}"
          TITLE="${TITLE//-/ }"

          cat > release-notes.md <<'EOF'
          基于上游 Iceraven 2.51.0 / Firefox 158.0。

          - 保留 parallel-1 的并发下载改动。
          - 恢复大屏设备与折叠屏展开状态下默认使用移动版网页。
          - 仍可按站点手动切换桌面版网页。
          - 提供 arm64-v8a、armeabi-v7a、x86_64 正式签名 APK 与 SHA256SUMS。
          EOF

          gh release create "$RELEASE_TAG" \
            "${RELEASE_TAG}-arm64-v8a.apk" \
            "${RELEASE_TAG}-armeabi-v7a.apk" \
            "${RELEASE_TAG}-x86_64.apk" \
            SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md
