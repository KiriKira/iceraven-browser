name: Release

on:
  push:
    tags:
      - 'iceraven-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-automation:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Inspect memory
        run: free -h

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD)" >> $GITHUB_ENV

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh
          python -m venv venv
          venv/bin/python -m pip install --no-cache-dir 'glean_parser~=20.1'

      - name: Relpace strings
        run: |
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build forkRelease variant of app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          /usr/bin/time -v ./gradlew app:assembleForkRelease -PversionName=${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: Create signed APKs
        uses: akliuxingyuan/sign-android-release@v2.0.1
        with:
          releaseDir: gradle/build/app/outputs/apk/forkRelease/
          signingKey: ${{ secrets.DEBUG_SIGNING_KEY }}
          keyAlias: ${{ secrets.DEBUG_ALIAS }}
          keyStorePassword: ${{ secrets.DEBUG_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Create changelog
        if: startsWith(github.ref, 'refs/tags/iceraven-')
        run: |
          PREVIOUS_RELEASE_TAG=$(git tag --list iceraven-* --sort=-creatordate | tail -n+2 | head -n 1)
          CURRENT_RELEASE_TAG="$GITHUB_REF_NAME"
          CURRENT_RELEASE_TAG_CAPITALIZE=${CURRENT_RELEASE_TAG^}
          CURRENT_RELEASE_TAG_CAPITALIZE=$(echo $CURRENT_RELEASE_TAG_CAPITALIZE | tr '-' ' ')
          echo "CURRENT_RELEASE_TAG_CAPITALIZE=${CURRENT_RELEASE_TAG_CAPITALIZE}" >> $GITHUB_ENV
          FENIX_TAG=$(cat version.txt | tr -d '\n')

          echo -e "## Release info\n" >> temp_changelog.md

          echo '```' >> temp_changelog.md
          echo "Iceraven: $(echo $CURRENT_RELEASE_TAG |  tr -d 'iceraven-')" >> temp_changelog.md
          echo "Fenix: ${FENIX_TAG}" >> temp_changelog.md
          echo -e '```\n' >> temp_changelog.md

          echo -e "## News\n" >> temp_changelog.md

          echo -e "## Change log\n" >> temp_changelog.md
          echo "[${PREVIOUS_RELEASE_TAG}...${CURRENT_RELEASE_TAG}](https://github.com/${{ github.repository }}/compare/${PREVIOUS_RELEASE_TAG}...${CURRENT_RELEASE_TAG})" >> temp_changelog.md

          if [ -f "docs/releases/${CURRENT_RELEASE_TAG}.md" ]; then
            cp "docs/releases/${CURRENT_RELEASE_TAG}.md" temp_changelog.md
          fi

      - name: Rename APKs for Release
        if: startsWith(github.ref, 'refs/tags/iceraven-')
        run: |
          mkdir -p dist_apks
          cp gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease.apk "dist_apks/${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp gradle/build/app/outputs/apk/forkRelease/app-armeabi-v7a-forkRelease.apk "dist_apks/${GITHUB_REF_NAME}-armeabi-v7a.apk"
          cp gradle/build/app/outputs/apk/forkRelease/app-x86_64-forkRelease.apk "dist_apks/${GITHUB_REF_NAME}-x86_64.apk"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for apk in dist_apks/*.apk; do
            "$BUILD_TOOLS_DIR/apksigner" verify "$apk"
          done
          (cd dist_apks && sha256sum *.apk > SHA256SUMS)

      - name: Release and Upload APKs
        if: startsWith(github.ref, 'refs/tags/iceraven-')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ env.CURRENT_RELEASE_TAG_CAPITALIZE }}"
          draft: false
          prerelease: false
          body_path: temp_changelog.md
          fail_on_unmatched_files: true
          files: |
            dist_apks/*.apk
            dist_apks/SHA256SUMS
